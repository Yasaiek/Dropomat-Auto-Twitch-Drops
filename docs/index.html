<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dropomat – Auto Twitch Drops Collector</title>
<meta name="description" content="Dropomat – automatic Twitch Drops collector. A browser extension that watches drop streams for you: queue the games, track new campaigns, optional auto-claim.">
<meta property="og:title" content="Dropomat – Auto Twitch Drops Collector">
<meta property="og:description" content="Watches Twitch drop streams for you. Queue the games and keep playing.">
<meta property="og:image" content="img/hero.png>
<link rel="icon" href="icon.png">
<style>
:root {
  --bg: #08080a; --card: #131316; --card2: #1a1a1f; --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.14);
  --text: #f4f4f6; --sub: #a5a5ad; --accent: #60cdff; --violet: #7c5cff; --ok: #6ccb5f; --warn: #f5c84c; --on: #00232f;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; overflow-x: hidden; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
img { max-width: 100%; }
.wrap { width: min(1080px, calc(100% - 32px)); margin: 0 auto; }
h1, h2, h3 { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-size: clamp(26px, 4vw, 36px); margin-bottom: 26px; }
section { padding: 72px 0; position: relative; }
.sub { color: var(--sub); }

/* tło: wolno płynące plamy światła */
.orbs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .32; animation: drift 26s ease-in-out infinite alternate; }
.orb.a { width: 520px; height: 520px; background: #2a6bff; left: -140px; top: -160px; }
.orb.b { width: 460px; height: 460px; background: var(--violet); right: -120px; top: 120px; animation-duration: 32s; animation-delay: -8s; }
.orb.c { width: 380px; height: 380px; background: #17b6d6; left: 35%; top: 620px; opacity: .16; animation-duration: 38s; }
@keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(60px, 50px) scale(1.15); } }

/* pasek górny */
nav { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(14px); background: rgba(8,8,10,.72); border-bottom: 1px solid var(--line); }
nav .wrap { display: flex; align-items: center; gap: 14px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; color: var(--text); }
.brand img { width: 30px; height: 30px; border-radius: 8px; }
.grow { flex: 1; }
.navlink { color: var(--sub); font-size: 14px; }
.navlink:hover { color: var(--text); text-decoration: none; }

.lang { position: relative; }
.lang-btn { display: flex; align-items: center; gap: 8px; font: inherit; font-size: 14px; color: var(--text); background: var(--card); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.lang-btn:hover { background: var(--card2); }
.flag svg { display: block; border-radius: 3px; box-shadow: 0 0 0 1px rgba(255,255,255,.16); }
.lang-menu { position: absolute; right: 0; top: calc(100% + 8px); width: 330px; max-width: calc(100vw - 32px); display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 6px; background: #1c1c21; border: 1px solid var(--line2); border-radius: 10px; box-shadow: 0 18px 44px rgba(0,0,0,.6); }
.lang-menu[hidden] { display: none; }
.lang-opt { display: flex; align-items: center; gap: 9px; font: inherit; font-size: 14px; color: var(--text); background: none; border: 1px solid transparent; border-radius: 6px; padding: 7px 9px; cursor: pointer; text-align: left; }
.lang-opt:hover { background: rgba(255,255,255,.07); }
.lang-opt.on { border-color: rgba(96,205,255,.5); background: rgba(96,205,255,.08); }

/* hero */
.hero { padding: 64px 0 40px; }
.hero .wrap { display: grid; grid-template-columns: 1.05fr .95fr; gap: 48px; align-items: center; }
.hero .eyebrow { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); border: 1px solid rgba(96,205,255,.35); background: rgba(96,205,255,.08); padding: 6px 12px; border-radius: 999px; margin-bottom: 14px; }
.hero h1 { font-size: clamp(44px, 7vw, 76px); letter-spacing: -.02em; background: linear-gradient(100deg, #fff 20%, var(--accent) 55%, var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p.lead { font-size: clamp(17px, 2.2vw, 21px); color: #d6d6dc; margin: 18px 0 28px; max-width: 30em; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { display: inline-flex; align-items: center; gap: 9px; font: inherit; font-weight: 600; padding: 12px 20px; border-radius: 10px; border: 1px solid var(--line2); background: var(--card); color: var(--text); cursor: pointer; transition: transform .15s, background .15s, box-shadow .15s; }
.btn:hover { text-decoration: none; transform: translateY(-2px); background: var(--card2); }
.btn.primary { background: linear-gradient(100deg, var(--accent), #8fb4ff); color: var(--on); border-color: transparent; box-shadow: 0 10px 30px rgba(96,205,255,.25); }
.btn.primary:hover { box-shadow: 0 14px 38px rgba(96,205,255,.38); }
.meta { margin-top: 18px; font-size: 14px; color: var(--sub); }
.stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.stat { min-width: 132px; padding: 11px 15px; border: 1px solid var(--line2); border-radius: 12px; background: rgba(255,255,255,.035); animation: statIn .5s ease both; }
.stat[hidden] { display: none; }
.stat b { display: block; font-size: 24px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--sub); }
.stat.live b::before { content: ''; display: inline-block; width: 9px; height: 9px; margin-right: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(108,203,95,.6); animation: livePulse 1.8s ease-out infinite; vertical-align: 3px; }
@keyframes livePulse { to { box-shadow: 0 0 0 9px rgba(108,203,95,0); } }
@keyframes statIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* animowana makieta okienka */
.demo { justify-self: center; width: min(390px, 100%); background: #0a0a0b; border: 1px solid var(--line2); border-radius: 16px; padding: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03); position: relative; animation: float 7s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-10px); } }
.d-head { display: flex; align-items: center; gap: 9px; margin-bottom: 11px; }
.d-head img { width: 26px; height: 26px; border-radius: 7px; }
.d-head b { font-size: 15px; }
.d-pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; color: var(--accent); border: 1px solid rgba(96,205,255,.35); background: rgba(96,205,255,.08); opacity: 0; transition: opacity .3s; }
.demo.run .d-pill { opacity: 1; }
.d-tabs { display: flex; gap: 2px; padding: 3px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; font-size: 12.5px; margin-bottom: 10px; }
.d-tabs span { flex: 1; text-align: center; padding: 5px 2px; border-radius: 5px; color: var(--sub); transition: background .25s, color .25s; }
.d-tabs span.on { background: var(--card2); color: var(--text); font-weight: 600; }
.d-view { display: flex; flex-direction: column; gap: 6px; min-height: 276px; }
.d-view[hidden] { display: none; }
.d-row { display: flex; align-items: center; gap: 10px; padding: 7px 10px 7px 7px; border-radius: 7px; background: var(--card); border: 1px solid var(--line); transition: border-color .25s, background .25s, transform .15s; }
.d-row.q { border-color: rgba(96,205,255,.5); background: rgba(96,205,255,.07); }
.d-row.tap { transform: scale(.98); }
.d-art { width: 28px; height: 38px; border-radius: 4px; flex-shrink: 0; background: #26262a center/cover no-repeat; }
.d-txt { flex: 1; min-width: 0; }
.d-txt b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-txt i { display: block; font-style: normal; font-size: 11.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-num { width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12.5px; color: #5d5d63; border: 1px dashed #3a3a40; flex-shrink: 0; }
.d-row.q .d-num { border: 0; background: var(--accent); color: var(--on); animation: pop .35s cubic-bezier(.3,1.8,.5,1); }
@keyframes pop { from { transform: scale(.3); } to { transform: scale(1); } }
.d-now { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 11px; }
.d-now b { font-size: 14px; }
.d-now i { display: block; font-style: normal; font-size: 12px; color: var(--sub); }
.d-bar { height: 4px; border-radius: 9px; background: #2a2a2e; margin-top: 10px; overflow: hidden; }
.d-bar div { height: 100%; width: 0; background: var(--accent); border-radius: 9px; }
.demo.watch .d-bar div { animation: fill 5.5s linear forwards; }
@keyframes fill { to { width: 100%; } }
.d-drops { display: flex; gap: 7px; margin-top: 9px; }
.d-drop { width: 30px; height: 30px; border-radius: 8px; padding: 2px; background: #34343a; position: relative; transition: background .4s; }
.d-drop span { display: block; width: 100%; height: 100%; border-radius: 6px; background: #101012; display: grid; place-items: center; font-size: 14px; }
.d-drop.done { background: var(--ok); }
.d-drop.done::after { content: "✓"; position: absolute; right: -4px; bottom: -4px; width: 14px; height: 14px; border-radius: 50%; background: var(--ok); color: #0b0b0c; font: 700 9px/14px system-ui; text-align: center; box-shadow: 0 0 0 2px var(--card); animation: pop .35s cubic-bezier(.3,1.8,.5,1); }
.d-drop.cur { background: conic-gradient(var(--accent) var(--p, 0%), #34343a 0); }
.cursor { position: absolute; width: 22px; height: 22px; left: 0; top: 0; pointer-events: none; transition: transform .7s cubic-bezier(.5,0,.2,1); z-index: 3; opacity: 0; }
.demo.live .cursor { opacity: 1; }

/* karty funkcji */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.card { background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.01)), var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; transition: transform .2s, border-color .2s; }
.card:hover { transform: translateY(-4px); border-color: rgba(96,205,255,.35); }
.card h3 { font-size: 18px; margin: 12px 0 6px; }
.card p { margin: 0; color: var(--sub); font-size: 15px; }
.ico { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: rgba(96,205,255,.1); color: var(--accent); }
.ico svg { width: 22px; height: 22px; }

/* instalacja */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; counter-reset: step; }
.step { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; position: relative; counter-increment: step; }
.step::before { content: counter(step); display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--on); font-weight: 700; margin-bottom: 12px; }
.step p { margin: 0; font-size: 15px; }
.step code, code { font-family: Consolas, "Cascadia Mono", monospace; font-size: .92em; background: rgba(255,255,255,.07); padding: 1px 6px; border-radius: 5px; overflow-wrap: anywhere; }
.shot { margin-top: 22px; border-radius: 14px; border: 1px solid var(--line2); overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.5); background: var(--card); }
.shot img { display: block; width: 100%; }
.note { margin-top: 16px; color: var(--sub); font-size: 14px; }

/* jak używać */
.use { display: grid; grid-template-columns: 300px 1fr; gap: 28px; align-items: start; }
.use-tabs { display: flex; flex-direction: column; gap: 8px; }
.use-tab { text-align: left; font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; transition: border-color .2s, background .2s; }
.use-tab b { display: block; margin-bottom: 3px; }
.use-tab span { color: var(--sub); font-size: 14px; }
.use-tab.on { border-color: rgba(96,205,255,.55); background: rgba(96,205,255,.06); }
.use-img { justify-self: center; width: min(430px, 100%); border-radius: 14px; border: 1px solid var(--line2); overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.55); }
.use-img img { display: block; width: 100%; animation: fade .35s; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }

/* faq + zgłoszenia */
.faq { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
details { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
details[open] { border-color: var(--line2); }
summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
summary::after { content: "+"; color: var(--accent); font-size: 20px; line-height: 1; transition: transform .2s; }
details[open] summary::after { transform: rotate(45deg); }
summary::-webkit-details-marker { display: none; }
details p { margin: 10px 0 0; color: var(--sub); font-size: 15px; }
.bug { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; background: linear-gradient(110deg, rgba(124,92,255,.16), rgba(96,205,255,.1)), var(--card); border: 1px solid var(--line2); border-radius: 16px; padding: 28px; }
.bug h2 { margin-bottom: 6px; }
.bug p { margin: 0; color: #cfcfd6; max-width: 38em; }
footer { border-top: 1px solid var(--line); padding: 28px 0 44px; color: var(--sub); font-size: 14px; text-align: center; }

.reveal { opacity: 0; transform: translateY(18px); transition: opacity .6s, transform .6s; }
.reveal.in { opacity: 1; transform: none; }
@media (max-width: 860px) {
  .hero .wrap, .use { grid-template-columns: 1fr; }
  .grid { grid-template-columns: 1fr 1fr; }
  .steps { grid-template-columns: 1fr 1fr; }
  .faq { grid-template-columns: 1fr; }
  section { padding: 52px 0; }
  .navlink { display: none; }
}
@media (max-width: 540px) { .grid, .steps { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) {
  .orb, .demo, .demo.watch .d-bar div { animation: none; }
  .reveal { opacity: 1; transform: none; transition: none; }
  html { scroll-behavior: auto; }
}
</style>
</head>

<div class="orbs"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>

<nav><div class="wrap">
  <a class="brand" href="#top"><img src="icon.png" alt="">Dropomat</a>
  <span class="grow"></span>
  <a class="navlink" href="#install" data-t="installTitle"></a>
  <a class="navlink" href="#use" data-t="howTitle"></a>
  <a class="navlink" href="#bug" data-t="report"></a>
  <div class="lang">
    <button class="lang-btn" id="langBtn" aria-haspopup="listbox"></button>
    <div class="lang-menu" id="langMenu" role="listbox" hidden></div>

</div></nav>

<header class="hero" id="top"><div class="wrap">
  <div>
    <div class="eyebrow">Auto Twitch Drops Collector</div>
    <h1>Dropomat</h1>
    <p class="lead" data-t="tagline"></p>
    <div class="cta">
      <a class="btn primary" id="dl" href="dropomat.zip" download>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-5-5m5 5 5-5M5 21h14"/></svg>
        <span data-t="download"></span> (ZIP)</a>
      <a class="btn" id="gh" href="#" target="_blank" rel="noopener"><span data-t="github"></span></a>
    </div>
    <div class="meta"><span data-t="version"></span> 1.2.6 · <span data-t="worksIn"></span></div>
    <div class="stats" id="stats" hidden>
      <div class="stat live" hidden><b id="stA">0</b><span data-t="stActive"></span></div>
      <div class="stat" hidden><b id="stD">0</b><span data-t="stDownloads"></span></div>
      <div class="stat" hidden><b id="stV">0</b><span data-t="stVisits"></span></div>

  </div>

  <div class="demo" id="demo" aria-hidden="true">
    <div class="d-head"><img src="icon.png" alt=""><b>Dropomat</b><span class="d-pill" data-u="pillOn"></span></div>
    <div class="d-tabs"><span id="dt1" class="on" data-u="tabCamps"></span><span id="dt2" data-u="tabQueue"></span><span data-u="tabTracked"></span><span data-u="tabSettings"></span></div>
    <div class="d-view" id="dv1"></div>
    <div class="d-view" id="dv2" hidden>
      <div class="d-now"><b id="dnTitle"></b><i id="dnSub"></i><div class="d-bar"><div></div></div>
        <div class="d-drops" id="dd"></div></div>
      <div id="dq" style="display:flex;flex-direction:column;gap:6px"></div>
    </div>
    <svg class="cursor" id="cur" viewBox="0 0 24 24"><path d="M5 3l14 8-6.2 1.8L10 19z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
  </div>
</div></header>

<section id="features"><div class="wrap">
  <h2 class="reveal" data-t="featTitle"></h2>
  <div class="grid" id="feat"></div>
</div></section>

<section id="install"><div class="wrap">
  <h2 class="reveal" data-t="installTitle"></h2>
  <div class="steps reveal"><div class="step"><p data-t="i1"></p></div><div class="step"><p data-t="i2" data-code="chrome://extensions"></p></div><div class="step"><p data-t="i3"></p></div><div class="step"><p data-t="i4"></p></div></div>
  <div class="shot reveal"><img src="img/install.png" alt="" loading="lazy"></div>
  <p class="note reveal"><b data-t="updateTitle"></b> – <span data-t="update" data-code="chrome://extensions"></span></p>
</div></section>

<section id="use"><div class="wrap">
  <h2 class="reveal" data-t="howTitle"></h2>
  <div class="use reveal">
    <div class="use-tabs" id="useTabs"></div>
    <div class="use-img"><img id="useImg" src="img/en/campaigns.png" alt=""></div>
  </div>
</div></section>

<section id="faq"><div class="wrap">
  <h2 class="reveal" data-t="faqTitle"></h2>
  <div class="faq reveal" id="faqList"></div>
</div></section>

<section id="bug"><div class="wrap">
  <div class="bug reveal">
    <div><h2 data-t="bugTitle"></h2><p data-t="bugText"></p></div>
    <a class="btn primary" id="issue" href="#" target="_blank" rel="noopener"><span data-t="report"></span></a>
  </div>
</div></section>

<footer><div class="wrap"><span data-t="disclaimer"></span> · MIT</div></footer>

d del stream, intervalos de comprobación y registro.", "faqTitle": "Conviene saber", "q1": "¿Tengo que dejar el stream en pantalla?", "a1": "No. Se reproduce en su propia ventana silenciada, que puede quedar minimizada mientras juegas.", "q2": "¿Reclama los drops por mí?", "a2": "Solo si lo activas en Ajustes. Si no, el juego queda como «Por reclamar» y la cola sigue.", "q3": "¿Es seguro para mi cuenta?", "a3": "Ver de forma automatizada va contra los términos de Twitch, así que lo usas bajo tu responsabilidad. Tu sesión nunca sale del navegador.", "q4": "¿Por qué falta una campaña en la lista?", "a4": "Pulsa ⟳ en la pestaña Campañas. Si sigue sin aparecer, añade el juego por nombre en la pestaña Viendo o síguelo.", "bugTitle": "¿Encontraste un error?", "bugText": "Abre una incidencia en GitHub. Describe qué pasó y pega la línea «Lectura …» de Ajustes → Registro.", "disclaimer": "Dropomat no está afiliado a Twitch. Úsalo bajo tu responsabilidad.", "updateTitle": "Actualizar", "update": "Sustituye los archivos de la carpeta y pulsa ⟳ junto a Dropomat en chrome://extensions. La cola y los ajustes se conservan.", "stActive": "Farmeando drops ahora mismo", "stDownloads": "Descargas", "stVisits": "Visitas al sitio", "q5": "¿Envía algún dato?", "a5": "Mientras funciona, la extensión suma +1 cada 10 minutos a un contador público anónimo para que esta página muestre cuántas personas están farmeando ahora. No se envía nada sobre ti, tu cuenta ni lo que ves, y puedes desactivarlo en Ajustes."}, "pt": {"tagline": "Assiste por você aos streams da Twitch com drops. Coloque os jogos na fila e continue jogando.", "download": "Baixar", "github": "Ver no GitHub", "report": "Relatar um bug", "version": "Versão", "featTitle": "O que faz", "f1t": "Escolha e enfileire", "f1": "As campanhas de drops abertas em uma lista só. Clique nos jogos na ordem que quiser – essa é a sua fila.", "f2t": "Assiste sozinho", "f2": "Abre uma janela muda e minimizada, escolhe um stream em que os drops do j r que falta uma campanha na lista?", "a4": "Clique em ⟳ na aba Campanhas. Se ainda faltar, adicione o jogo pelo nome na aba Assistindo ou acompanhe-o.", "bugTitle": "Achou um bug?", "bugText": "Abra uma issue no GitHub. Descreva o que aconteceu e cole a linha “Leitura …” de Ajustes → Registro.", "disclaimer": "O Dropomat não é afiliado à Twitch. Use por sua conta e risco.", "updateTitle": "Atualização", "update": "Substitua os arquivos da pasta e clique em ⟳ ao lado do Dropomat em chrome://extensions. A fila e os ajustes ficam.", "stActive": "Farmando drops agora", "stDownloads": "Downloads", "stVisits": "Visitas ao site", "q5": "Ela envia algum dado?", "a5": "Enquanto está rodando, a extensão soma +1 a cada 10 minutos a um contador público anônimo para que esta página mostre quantas pessoas estão farmando agora. Nada sobre você, sua conta ou o que você assiste é enviado, e dá para desativar nas Configurações."}, "it": {"tagline": "Guarda al posto tuo gli stream di Twitch con i drop. Metti in coda i giochi e continua a giocare.", "download": "Scarica", "github": "Vedi su GitHub", "report": "Segnala un bug", "version": "Versione", "featTitle": "Cosa fa", "f1t": "Scegli e metti in coda", "f1": "Le campagne di drop aperte in un’unica lista. Fai clic sui giochi nell’ordine che vuoi: quella è la tua coda.", "f2t": "Guarda da solo", "f2": "Apre una finestra silenziata e ridotta a icona, sceglie uno stream in cui i drop del gioco funzionano davvero e passa oltre quando finisce.", "f3t": "Segue i nuovi drop", "f3": "Metti una stella a un gioco: quando compare una nuova campagna entra in coda e parte da solo.", "f4t": "Mostra il progresso reale", "f4": "Legge il progresso dal tuo account Twitch, mostra ogni drop con la sua icona e cambia stream se il progresso si ferma.", "f5t": "Riscatto facoltativo", "f5": "Può riscattare per te i drop ottenuti, solo se Twitch conferma che l’account di gioco è collegato.", "f6t": "12 lingue", "f6": "Tutta l’interfaccia in 12 lingue, modificabile in qualsiasi momento.", "installTitle": "Installazione in un minuto", "i1": "Scarica lo ZIP ed estrailo in una cartella che terrai.", "i2": "Apri chrome://extensions e attiva la Modalità sviluppatore (in alto a destra).", "i3": "Fai clic su «Carica estensione non pacchettizzata» e scegli la cartella estratta.", "i4": "Accedi su twitch.tv, apri Dropomat, fai clic sui giochi che vuoi e premi Avvia.", "worksIn": "Funziona in Chrome, Edge, Opera, Brave e altri browser Chromium.", "howTitle": "Come si usa", "h1t": "Campagne", "h1": "Fai clic sui giochi nell’ordine in cui vanno guardati. Clic destro = segui un gioco.", "h2t": "In visione", "h2": "Vedi cosa è in riproduzione, trascina i giochi per riordinare la coda e segui ogni drop.", "h3t": "Seguiti", "h3": "Giochi che partono da soli appena compare una nuova campagna.", "h4t": "Impostazioni", "h4": "Lingua, riscatto automatico, qualità dello stream, intervalli di controllo e registro.", "faqTitle": "Buono a sapersi", "q1": "Devo tenere lo stream sullo schermo?", "a1": "No. Gira in una sua finestra silenziata che può restare ridotta a icona mentre giochi.", "q2": "Riscatta i drop al posto mio?", "a2": "Solo se lo attivi nelle Impostazioni. Altrimenti il gioco passa a «Da riscattare» e la coda prosegue.", "q3": "È sicuro per il mio account?", "a3": "La visione automatizzata è contraria ai termini di Twitch, quindi lo usi a tuo rischio. Il tuo accesso non lascia mai il browser.", "q4": "Perché manca una campagna nell’elenco?", "a4": "Premi ⟳ nella scheda Campagne. Se manca ancora, aggiungi il gioco per nome nella scheda In visione oppure seguilo.", "bugTitle": "Hai trovato un bug?", "bugText": "Apri una segnalazione su GitHub. Descrivi cosa è successo e incolla la riga «Lettura …» da Impostazioni → Registro.", "disclaimer": "Dropomat non è affiliato a Twitch. Usalo a tuo rischio.", "updateTitle": "Aggiornamento", "update": "Sostituisci i file nella cartella e premi ⟳ accanto a Dropomat in chrome://extensions. Coda h1t": "Кампании", "h1": "Кликайте игры в том порядке, в котором их нужно смотреть. Правая кнопка = отслеживать игру.", "h2t": "Просмотр", "h2": "Видно, что идёт сейчас; перетаскивайте игры, чтобы поменять очередь, и следите за каждым дропом.", "h3t": "Отслеживаемые", "h3": "Игры, которые запустятся сами, как только появится новая кампания.", "h4t": "Настройки", "h4": "Язык, автополучение, качество стрима, интервалы проверки и журнал.", "faqTitle": "Полезно знать", "q1": "Нужно ли держать стрим на экране?", "a1": "Нет. Он идёт в отдельном беззвучном окне, которое может быть свёрнуто, пока вы играете.", "q2": "Он забирает дропы за меня?", "a2": "Только если включить это в настройках. Иначе игра получает статус «Забрать», а очередь идёт дальше.", "q3": "Безопасно ли это для аккаунта?", "a3": "Автоматический просмотр нарушает условия Twitch, так что вы используете его на свой риск. Ваш вход не покидает браузер.", "q4": "Почему в списке нет кампании?", "a4": "Нажмите ⟳ на вкладке «Кампании». Если её всё равно нет, добавьте игру по названию на вкладке «Просмотр» или отслеживайте её.", "bugTitle": "Нашли ошибку?", "bugText": "Создайте issue на GitHub. Опишите, что произошло, и вставьте строку «Обновлено …» из «Настройки → Журнал».", "disclaimer": "Dropomat не связан с Twitch. Используйте на свой риск.", "updateTitle": "Обновление", "update": "Замените файлы в папке и нажмите ⟳ рядом с Dropomat на chrome://extensions. Очередь и настройки сохранятся.", "stActive": "Фармят дропы прямо сейчас", "stDownloads": "Загрузки", "stVisits": "Посещения сайта", "q5": "Отправляет ли оно какие-то данные?", "a5": "Пока расширение работает, оно раз в 10 минут добавляет +1 к анонимному публичному счётчику, чтобы эта страница могла показать, сколько человек фармит прямо сейчас. Ничего о вас, вашем аккаунте или о том, что вы смотрите, не отправляется, а в настройках это можно отключить."}, "uk": {"tagline": "Дивиться за вас стрими Twitch із дропами. Поставте ігри в чергу й грайте далі.", "download": "Завантажити", "github": "Відкрити на GitHub", "report": "Повідомити про помилку", "version": "Версія", "featTitle": "Що він робить", "f1t": "Вибір і черга", "f1": "Відкриті кампанії дропів в одному списку. Клацайте ігри в потрібному порядку – це й є черга.", "f2t": "Дивиться сам", "f2": "Відкриває беззвучне згорнуте вікно, вибирає стрим, де дропи цієї гри справді йдуть, і переходить далі, коли він закінчується.", "f3t": "Стежить за новими дропами", "f3": "Позначте гру зірочкою: коли з’явиться нова кампанія, гра потрапить у чергу й запуститься сама.", "f4t": "Показує справжній прогрес", "f4": "Читає прогрес із вашого акаунта Twitch, показує кожен дроп з іконкою та змінює стрим, якщо прогрес стоїть.", "f5t": "Автоотримання за бажанням", "f5": "Може забирати отримані дропи за вас – лише якщо Twitch підтверджує, що ігровий акаунт прив’язано.", "f6t": "12 мов", "f6": "Увесь інтерфейс 12 мовами, перемикається будь-коли.", "installTitle": "Встановлення за хвилину", "i1": "Завантажте ZIP і розпакуйте в папку, яку не видалятимете.", "i2": "Відкрийте chrome://extensions і ввімкніть «Режим розробника» (праворуч угорі).", "i3": "Натисніть «Завантажити розпаковане розширення» й виберіть розпаковану папку.", "i4": "Увійдіть на twitch.tv, відкрийте Dropomat, клацніть потрібні ігри й натисніть «Старт».", "worksIn": "Працює в Chrome, Edge, Opera, Brave та інших браузерах на Chromium.", "howTitle": "Як користуватися", "h1t": "Кампанії", "h1": "Клацайте ігри в тому порядку, в якому їх треба дивитися. Права кнопка = відстежувати гру.", "h2t": "Перегляд", "h2": "Видно, що йде зараз; перетягуйте ігри, щоб змінити чергу, і стежте за кожним дропом.", "h3t": "Відстежувані", "h3": "Ігри, які запустяться самі, щойно з’явиться нова кампанія.", "h4t": "Налаштування", "h4": "Мова, автоотримання, якість стриму, інтервали перевірки та журнал.", "faqTitle": "Варто знати", "q1": "Чи треба тримати стрим на екрані?", "a1": "Ні. Він іде в окремому беззвучному вікні, яке може бути згорнуте, поки ви граєте.", "q2": "Він забирає дропи за мене?", "a2": "Лише якщо ввімкнути це в налаштуваннях. Інакше гра отримує статус «Забрати», а черга йде далі.", "q3": "Чи безпечно це для акаунта?", "a3": "Автоматичний перегляд порушує умови Twitch, тож ви користуєтеся ним на власний ризик. Ваш вхід не залишає браузер.", "q4": "Чому в списку немає кампанії?", "a4": "Натисніть ⟳ на вкладці «Кампанії». Якщо її все одно немає, додайте гру за назвою на вкладці «Перегляд» або відстежуйте її.", "bugTitle": "Знайшли помилку?", "bugText": "Створіть issue на GitHub. Опишіть, що сталося, і вставте рядок «Оновлено …» з «Налаштування → Журнал».", "disclaimer": "Dropomat не пов’язаний із Twitch. Користуйтеся на власний ризик.", "updateTitle": "Оновлення", "update": "Замініть файли в папці й натисніть ⟳ біля Dropomat на chrome://extensions. Черга й налаштування залишаться.", "stActive": "Фармлять дропи просто зараз", "stDownloads": "Завантаження", "stVisits": "Відвідування сайту", "q5": "Чи надсилає воно якісь дані?", "a5": "Поки розширення працює, воно раз на 10 хвилин додає +1 до анонімного публічного лічильника, щоб ця сторінка могла показати, скільки людей фармить просто зараз. Нічого про вас, ваш акаунт чи те, що ви дивитеся, не надсилається, а в налаштуваннях це можна вимкнути."}, "tr": {"tagline": "Droplu Twitch yayınlarını sizin yerinize izler. Oyunları sıraya koyun ve oynamaya devam edin.", "download": "İndir", "github": "GitHub’da gör", "report": "Hata bildir", "version": "Sürüm", "featTitle": "Ne yapar", "f1t": "Seç ve sıraya koy", "f1": "Açık drop kampanyaları tek listede. Oyunlara istediğiniz sırayla tıklayın – sıranız bu olur.", "f2t": "Kendi kendine izler", "f2": "Sessiz, simge durumunda bir pencere açar, oyunun droplarının gerçekten verildiği bir yayın seçer ve bitince sıradakine geçer.", "f3t": "Yeni dropları takip eder", "f3": "Oyuna yıldız koyun: yeni kampanya çıkınca sıraya girer ve kendiliğinden başlar.", "f4t": "Gerçek ilerlemeyi gösterir", "f4": "İlerlemeyi Twitch hesabınızdan okur, her dropu simgesiyle gösterir ve ilerleme durursa yayını değiştirir.", "f5t": "İsteğe bağlı otomatik alma", "f5": "Kazanılan dropları sizin yerinize alabilir – yalnızca Twitch oyun hesabının bağlı olduğunu doğruladığında.", "f6t": "12 dil", "f6": "Tüm arayüz 12 dilde, istediğiniz zaman değiştirilebilir.", "installTitle": "Bir dakikada kurulum", "i1": "ZIP dosyasını indirin ve silmeyeceğiniz bir klasöre çıkarın.", "i2": "chrome://extensions sayfasını açın ve Geliştirici modunu açın (sağ üst).", "i3": "“Paketlenmemiş öğe yükle”ye tıklayın ve çıkardığınız klasörü seçin.", "i4": "twitch.tv’de giriş yapın, Dropomat’ı açın, istediğiniz oyunlara tıklayın ve Başlat’a basın.", "worksIn": "Chrome, Edge, Opera, Brave ve diğer Chromium tarayıcılarında çalışır.", "howTitle": "Nasıl kullanılır", "h1t": "Kampanyalar", "h1": "Oyunlara izlenmesini istediğiniz sırayla tıklayın. Sağ tık = oyunu takip et.", "h2t": "İzlenen", "h2": "Şu an ne oynadığını görün, sırayı değiştirmek için oyunları sürükleyin ve her dropu izleyin.", "h3t": "Takip", "h3": "Yeni kampanya çıkar çıkmaz kendiliğinden başlayan oyunlar.", "h4t": "Ayarlar", "h4": "Dil, otomatik alma, yayın kalitesi, kontrol aralıkları ve günlük.", "faqTitle": "Bilmekte fayda var", "q1": "Yayın ekranda kalmak zorunda mı?", "a1": "Hayır. Kendi sessiz penceresinde oynar; siz oynarken simge durumunda kalabilir.", "q2": "Dropları benim yerime alır mı?", "a2": "Yalnızca Ayarlar’dan açarsanız. Aksi halde oyun “Alınacak” olarak işaretlenir ve sıra devam eder.", "q3": "Hesabım için güvenli mi?", "a3": "Otomatik izleme Twitch kullanım şartlarına aykırıdır; riski siz üstlenirsiniz. Girişiniz tarayıcınızdan asla çıkmaz.", "q4": "Listede neden bir kampanya eksik?", "a4": "Kampanyalar sekmesinde ⟳ düğmesine basın. Hâlâ yoksa oyunu İzlenen sekmesinde adıyla ekleyin ya da takip edin.", "bugTitle": "Hata mı buldunuz?", "bugText": "GitHub’da bir issue açın. Ne olduğunu yazın ve Ayarlar → Günlük’teki “Okuma …” satırını yapıştırın.", "disclaimer": "Dropomat’ın Twitch ile bir bağlantısı yoktur. Riski size aittir.", "updateTitle": "Güncelleme", "update": "Klasördeki dosyaları değiştirin ve chrome://extensions sayfasında Dropomat’ın yanındaki ⟳ düğmesine basın. Sıra ve ayarlar kalır.", "stActive": "Şu an drop kasanlar", "stDownloads": "İndirmeler", "stVisits": "Site ziyaretleri", "q5": "Herhangi bir veri gönderiyor mu?", "a5": "Uzantı çalışırken 10 dakikada bir anonim, herkese açık bir sayaca +1 ekler; böylece bu sayfa şu an kaç kişinin drop kastığını gösterebilir. Siz, hesabınız veya izledikleriniz hakkında hiçbir şey gönderilmez ve Ayarlar’dan kapatabilirsiniz."}, "zh": {"tagline": "替你观看有掉宝的 Twitch 直播。把游戏排好队，继续玩你的。", "download": "下载", "github": "在 GitHub 查看", "report": "报告问题", "version": "版本", "featTitle": "它能做什么", "f1t": "选择并排队", "f1": "进行中的掉宝活动集中在一个列表里。按想要的顺序点击游戏，这就是你的队列。", "f2t": "自动观看", "f2": "打开一个静音、最小化的窗口，挑选该游戏掉宝确实生效的直播，直播结束后自动换下一个。", "f3t": "关注新掉宝", "f3": "给游戏加星标：出现新活动时，它会自动进入队列并开始观看。", "f4t": "显示真实进度", "f4": "从你的 Twitch 账号读取进度，用图标显示每个掉宝，进度停滞时自动换直播。", "f5t": "可选的自动领取", "f5": "可以替你领取已获得的掉宝——仅在 Twitch 确认游戏账号已绑定时进行。", "f6t": "12 种语言", "f6": "整个界面支持 12 种语言，可随时切换。", "installTitle": "一分钟安装", "i1": "下载 ZIP 并解压到一个会长期保留的文件夹。", "i2": "打开 chrome://extensions，开启“开发者模式”（右上角）。", "i3": "点击“加载已解压的扩展程序”，选择解压后的文件夹。", "i4": "登录 twitch.tv，打开 Dropomat，点击想看的游戏，然后按“开始”。", "worksIn": "适用于 Chrome、Edge、Opera、Brave 等 Chromium 浏览器。", "howTitle": "如何使用", "h1t": "活动", "h1": "按想要观看的顺序点击游戏。右键可关注某个游戏。", "h2t": "观看", "h2": "查看当前在看什么，拖动游戏调整队列，并跟踪每个掉宝。", "h3t": "关注", "h3": "一有新活动就自动开始的游戏。", "h4t": "设置", "h4": "语言、自动领取、直播画质、检查间隔和日志。", "faqTitle": "须知", "q1": "直播必须留在屏幕上吗？", "a1": "不用。它在独立的静音窗口里播放，你玩游戏时可以保持最小化。", "q2": "它会替我领取掉宝吗？", "a2": "只有在设置里开启后才会。否则游戏会标记为“待领取”，队列继续往下走。", "q3": "对账号安全吗？", "a3": "自动观看违反 Twitch 的服务条款，使用风险自负。你的登录信息不会离开浏览器。", "q4": "为什么列表里缺少某个活动？", "a4": "在“活动”标签页点击 ⟳。如果还是没有，可在“观看”标签页按名称添加游戏，或者关注它。", "bugTitle": "发现问题？", "bugText": "请在 GitHub 提交 issue。说明发生了什么，并粘贴“设置 → 日志”里的“读取于 …”那一行。", "disclaimer": "Dropomat 与 Twitch 无关联。使用风险自负。", "updateTitle": "更新", "update": "替换文件夹中的文件，然后在 chrome://extensions 里点击 Dropomat 旁的 ⟳。队列和设置会保留。", "stActive": "此刻正在挂掉宝", "stDownloads": "下载次数", "stVisits": "网站访问量", "q5": "它会发送任何数据吗？", "a5": "扩展运行时，每 10 分钟为匿名的公开计数器 +1，这样本页面才能显示此刻有多少人在挂掉宝。不会发送任何关于你、你的账号或观看内容的信息，并且可以在设置中关闭。"}, "ja": {"tagline": "ドロップ対象の Twitch 配信を代わりに視聴します。ゲームをキューに入れて、そのまま遊び続けられます。", "download": "ダウンロード", "github": "GitHub で見る", "report": "不具合を報告", "version": "バージョン", "featTitle": "できること", "f1t": "選んでキューに入れる", "f1": "開催中のドロップキャンペーンを一覧表示。見たい順にゲームをクリックすれば、それがキューになります。", "f2t": "自動で視聴", "f2": "ミュートした最小化ウィンドウを開き、そのゲームのドロップが実際に有効な配信を選び、終了したら次へ進みます。", "f3t": "新しいドロップを追跡", "f3": "ゲームに星を付けておくと、新しいキャンペーンが始まったときに自動でキューに入り、視聴が始まります。", "f4t": "実際の進捗を表示", "f4": "Twitch アカウントから進捗を読み取り、各ドロップをアイコン付きで表示。進捗が止まると配信を切り替えます。", "f5t": "自動受け取り（任意）", "f5": "獲得したドロップを代わりに受け取れます。Twitch がゲームアカウントの連携を確認できた場合のみ行います。", "f6t": "12 言語", "f6": "インターフェース全体が 12 言語に対応し、いつでも切り替えられます。", "installTitle": "1 分でインストール", "i1": "ZIP をダウンロードし、残しておくフォルダーに展開します。", "i2": "chrome://extensions を開き、右上の「デベロッパー モード」をオンにします。", "i3": "「パッケージ化されていない拡張機能を読み込む」をクリックし、展開したフォルダーを選びます。", "i4": "twitch.tv にログインし、Dropomat を開いて見たいゲームをクリックし、「開始」を押します。", "worksIn": "Chrome、Edge、Opera、Brave などの Chromium 系ブラウザーで動作します。", "howTitle": "使い方", "h1t": "キャンペーン", "h1": "視聴したい順にゲームをクリックします。右クリックでゲームを追跡できます。", "h2t": "視聴", "h2": "今見ている配信を確認し、ドラッグでキューを並べ替え、各ドロップの進み具合を確認できます。", "h3t": "追跡", "h3": "新しいキャンペーンが始まるとすぐに自動で開始されるゲームです。", "h4t": "設定", "h4": "言語、自動受け取り、配信の画質、確認間隔、ログ。", "faqTitle": "知っておきたいこと", "q1": "配信を画面に出しておく必要はありますか？", "a1": "いいえ。専用のミュートされたウィンドウで再生され、遊んでいる間は最小化したままで構いません。", "q2": "ドロップを代わりに受け取ってくれますか？", "a2": "設定で有効にした場合のみです。無効のときはゲームが「受け取り待ち」になり、キューは先へ進みます。", "q3": "アカウントに影響はありませんか？", "a3": "自動視聴は Twitch の利用規約に反するため、自己責任でご利用ください。ログイン情報がブラウザーの外に出ることはありません。", "q4": "一覧にキャンペーンが見当たらないのはなぜですか？", "a4": "「キャンペーン」タブの ⟳ を押してください。それでも出ない場合は、「視聴」タブでゲーム名から追加するか、追跡してください。", "bugTitle": "不具合を見つけたら", "bugText": "GitHub で issue を作成してください。何が起きたかを書き、「設定 → ログ」の「取得 …」の行を貼り付けてください。", "disclaimer": "Dropomat は Twitch と提携していません。自己責任でご利用ください。", "updateTitle": "更新", "update": "フォルダー内のファイルを置き換え、chrome://extensions で Dropomat の横の ⟳ を押します。キューと設定は残ります。", "stActive": "現在ドロップ獲得中", "stDownloads": "ダウンロード数", "stVisits": "サイト訪問数", "q5": "何かデータを送信しますか？", "a5": "拡張機能の稼働中、10分ごとに匿名の公開カウンターに +1 します。これにより、このページで現在何人が稼働中かを表示できます。あなたやアカウント、視聴内容に関する情報は送信されず、設定でオフにできます。"}};

document.getElementById('gh').href = repo || 'https://github.com';
document.getElementById('issue').href = repo ? repo + '/issues/new/choose' : 'https://github.com';

// Liczniki pod przyciskami: pobrania (GitHub Releases), wejścia na stronę i aktywne instalacje (publiczny licznik).
// Każdy pokazuje się tylko wtedy, gdy uda się go odczytać; liczymy wyłącznie na prawdziwej stronie projektu.
const COUNTER = 'https://abacus.jasoncameron.dev', NS = 'dropomat-yasaiek';
const setStat = (id, v) => {
  if (!(v >= 0)) return;
  const b = document.getElementById(id);
  b.textContent = Number(v).toLocaleString('en-US').replace(/,/g, ' ');
  b.parentNode.hidden = false; document.getElementById('stats').hidden = false;
};
const counter = async (path) => {
  const r = await fetch(COUNTER + path, { cache: 'no-store' });
  if (r.status === 404) return 0; // licznik jeszcze nie istnieje
  if (!r.ok) throw new Error('counter');
  return Number((await r.json()).value) || 0;
};
if (repo) {
  (async () => { // wejścia: +1 raz na sesję przeglądarki
    try {
      let seen = false; try { seen = sessionStorage.getItem('dv') === '1'; } catch (e) {}
      const v = await counter((seen ? '/get/' : '/hit/') + NS + '/visits');
      try { sessionStorage.setItem('dv', '1'); } catch (e) {}
      setStat('stV', v);
    } catch (e) {}
  })();
  // farmi teraz: działające rozszerzenie dolicza się raz na 10-minutowe okno; bierzemy większą z liczb „to okno” i „poprzednie”
  const loadNow = async () => {
    try {
      const w = Math.floor(Date.now() / 600000);
      const [a, b] = await Promise.all([counter('/get/' + NS + '/run-' + w), counter('/get/' + NS + '/run-' + (w - 1))]);
      setStat('stA', Math.max(a, b));
    } catch (e) {}
  };
  loadNow(); setInterval(() => { if (!document.hidden) loadNow(); }, 60000);
  (async () => { // pobrania: suma pobrań paczek ze wszystkich wydań; przycisk kieruje do najnowszego wydania, żeby się liczyły
    try {
      let list = null;
      try { const c = JSON.parse(sessionStorage.getItem('rel') || 'null'); if (c && Date.now() - c.t < 600000) list = c.l; } catch (e) {}
      if (!list) {
        const r = await fetch(repo.replace('https://github.com/', 'https://api.github.com/repos/') + '/releases?per_page=100');
        if (!r.ok) throw new Error('releases');
        list = (await r.json()).map((x) => (x.assets || []).map((a) => [a.name, a.download_count]));
        try { sessionStorage.setItem('rel', JSON.stringify({ t: Date.now(), l: list })); } catch (e) {}
      }
      setStat('stD', list.flat().reduce((n, a) => n + (a[1] || 0), 0));
      if (list[0] && list[0].some((a) => a[0] === 'dropomat.zip')) {
        const dl = document.getElementById('dl');
        dl.href = repo + '/releases/latest/download/dropomat.zip'; dl.removeAttribute('download');
      }
    } catch (e) {}
  })();
}

let lang = 'en';
try {
  const q = new URLSearchParams(location.search).get('lang');
  const saved = localStorage.getItem('lang');
  const nav = (navigator.language || 'en').toLowerCase().slice(0, 2);
  lang = [q, saved, nav].find((x) => x && STR[x]) || 'en';
} catch (e) {}

const FEAT_ICONS = [
  '<path d="M4 6h16M4 12h10M4 18h6"/><circle cx="19" cy="15" r="3"/>',
  '<rect x="3" y="5" width="18" height="13" rx="2"/><path d="M10 9.5v5l4-2.5z" fill="currentColor"/>',
  '<path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/>',
  '<path d="M4 19V9m6 10V5m6 14v-7m4 7H2"/>',
  '<path d="M20 12v8H4v-8m-2-5h20v5H2zM12 7v13M12 7S9 2 6.5 3.5 8 7 12 7zm0 0s3-5 5.5-3.5S16 7 12 7z"/>',
  '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>'
];
const GAMES = [
  ['Crimson Desert', 'Crimson Desert DLC Week 2', 'crimson-desert'], ['Cyberpunk 2077', 'Quadra Paintjobs', 'cyberpunk-2077'],
  ['Genshin Impact', 'V7.2 Genshin Impact Drops', 'genshin-impact'], ['Rainbow Six Siege', 'Twitch Drops', 'rainbow-six-siege'], ['Sea of Thieves', 'Twitch Drops', 'sea-of-thieves']
];

function apply() {
  const s = STR[lang], u = UI[lang] || UI.en;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach((n) => {
    const txt = s[n.dataset.t] || STR.en[n.dataset.t] || '';
    if (n.dataset.code && txt.includes(n.dataset.code)) n.innerHTML = esc(txt).replace(n.dataset.code, '<code>' + n.dataset.code + '</code>');
    else n.textContent = txt;
  });
  document.querySelectorAll('[data-u]').forEach((n) => { n.textContent = u[n.dataset.u] || ''; });
  document.title = 'Dropomat – ' + s.tagline;
  document.getElementById('feat').innerHTML = [1, 2, 3, 4, 5, 6].map((i) =>
    '<div class="card reveal in"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + FEAT_ICONS[i - 1] + '</svg></div><h3>' + esc(s['f' + i + 't']) + '</h3><p>' + esc(s['f' + i]) + '</p></div>').join('');
  document.getElementById('faqList').innerHTML = [1, 2, 3, 4, 5].map((i) => '<details' + (i === 1 ? ' open' : '') + '><summary>' + esc(s['q' + i]) + '</summary><p>' + esc(s['a' + i]) + '</p></details>').join('');
  const shots = ['campaigns', 'watching', 'tracked', 'settings'];
  const dir = SHOT_LANGS.includes(lang) ? lang : 'en';
  const tabs = document.getElementById('useTabs');
  tabs.innerHTML = [1, 2, 3, 4].map((i) => '<button class="use-tab' + (i === useIdx ? ' on' : '') + '" data-i="' + i + '"><b>' + esc(s['h' + i + 't']) + '</b><span>' + esc(s['h' + i]) + '</span></button>').join('');
  const img = document.getElementById('useImg');
  const show = (i) => { useIdx = i; img.src = 'img/' + dir + '/' + shots[i - 1] + '.png'; tabs.querySelectorAll('.use-tab').forEach((b) => b.classList.toggle('on', Number(b.dataset.i) === i)); };
  tabs.querySelectorAll('.use-tab').forEach((b) => { b.onclick = () => { userPicked = true; show(Number(b.dataset.i)); }; });
  show(useIdx);
  const cur = LANGS.find((l) => l[0] === lang);
  document.getElementById('langBtn').innerHTML = flag(lang) + '<span>' + esc(cur[1]) + '</span><span style="color:var(--sub);font-size:11px">▾</span>';
  document.getElementById('langMenu').innerHTML = LANGS.map((l) => '<button class="lang-opt' + (l[0] === lang ? ' on' : '') + '" role="option" data-l="' + l[0] + '">' + flag(l[0]) + '<span>' + esc(l[1]) + '</span></button>').join('');
  document.querySelectorAll('.lang-opt').forEach((b) => { b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem('lang', lang); } catch (e) {} document.getElementById('langMenu').hidden = true; apply(); resetDemo(); }; });
}
let useIdx = 1, userPicked = false;
document.getElementById('langBtn').onclick = (e) => { e.stopPropagation(); const m = document.getElementById('langMenu'); m.hidden = !m.hidden; };
document.addEventListener('click', (e) => { if (!e.target.closest('.lang')) document.getElementById('langMenu').hidden = true; });
setInterval(() => { if (!userPicked && document.getElementById('use').getBoundingClientRect().top < innerHeight) { const b = document.querySelector('.use-tab[data-i="' + (useIdx % 4 + 1) + '"]'); if (b) { useIdx = useIdx % 4 + 1; b.click(); userPicked = false; } } }, 4200);

// ── animowana makieta: klikanie gier → numery → oglądanie z rosnącym postępem
const demo = document.getElementById('demo');
let demoRun = 0;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function row(g) { return '<div class="d-row"><div class="d-art" style="background-image:url(img/games/' + g[2] + '.png)"></div><div class="d-txt"><b>' + g[0] + '</b><i>' + g[1] + '</i></div><div class="d-num">+</div></div>'; }
async function runDemo() {
  const my = ++demoRun;
  const u = UI[lang] || UI.en;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const v1 = document.getElementById('dv1'), v2 = document.getElementById('dv2'), cur = document.getElementById('cur');
  const alive = () => my === demoRun;
  while (alive()) {
    demo.className = 'demo live';
    v1.hidden = false; v2.hidden = true;
    document.getElementById('dt1').className = 'on'; document.getElementById('dt2').className = '';
    v1.innerHTML = GAMES.map(row).join('');
    const rows = [...v1.querySelectorAll('.d-row')];
    const order = [1, 4, 3];
    if (reduce) { order.forEach((i, n) => { rows[i].classList.add('q'); rows[i].querySelector('.d-num').textContent = n + 1; }); demo.classList.remove('live'); return; }
    cur.style.transform = 'translate(300px, 330px)';
    await sleep(900);
    for (let n = 0; n < order.length && alive(); n++) {
      const r = rows[order[n]];
      const box = r.getBoundingClientRect(), base = demo.getBoundingClientRect();
      cur.style.transform = 'translate(' + (box.right - base.left - 40) + 'px,' + (box.top - base.top + 16) + 'px)';
      await sleep(820);
      r.classList.add('tap'); await sleep(110); r.classList.remove('tap');
      r.classList.add('q'); r.querySelector('.d-num').textContent = n + 1;
      await sleep(520);
    }
    if (!alive()) return;
    await sleep(700);
    // start → zakładka „Oglądane”
    demo.classList.add('run');
    document.getElementById('dt1').className = ''; document.getElementById('dt2').className = 'on';
    v1.hidden = true; v2.hidden = false; demo.classList.remove('live');
    const first = GAMES[order[0]];
    document.getElementById('dnTitle').textContent = first[0];
    document.getElementById('dnSub').textContent = (u.nWatching || 'Watching {url}').replace('{url}', 'twitch.tv/cdprojektred') + ' · 160p';
    document.getElementById('dq').innerHTML = order.map((i, n) => '<div class="d-row' + (n === 0 ? ' q' : '') + '"><div class="d-num" style="' + (n ? 'border:0;background:var(--accent);color:var(--on)' : '') + '">' + (n + 1) + '</div><div class="d-art" style="background-image:url(img/games/' + GAMES[i][2] + '.png)"></div><div class="d-txt"><b>' + GAMES[i][0] + '</b><i>' + (n === 0 ? u.stWatching : u.stPending) + '</i></div></div>').join('');
    document.getElementById('dd').innerHTML = '<div class="d-drop"><span style="background:#101012 url(img/games/cp1.png) center/cover"></span></div>';
    const drops = [...v2.querySelectorAll('.d-drop')];
    drops.forEach((d) => { d.className = 'd-drop'; d.style.removeProperty('--p'); });
    void v2.offsetWidth; demo.classList.add('watch');
    for (let i = 0; i < drops.length && alive(); i++) {
      drops[i].classList.add('cur');
      for (let p = 0; p <= 100 && alive(); p += 4) { drops[i].style.setProperty('--p', p + '%'); await sleep(210); }
      drops[i].classList.remove('cur'); drops[i].classList.add('done');
    }
    await sleep(1800);
  }
}
function resetDemo() { runDemo(); }

// pojawianie się sekcji przy przewijaniu
const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12 });
document.querySelectorAll('.reveal').forEach((n) => io.observe(n));

apply();
runDemo();
</script>
</body>
</html>
